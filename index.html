<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vidriería — Facturación y Contabilidad</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root {
    --bg:#EDF1F4; --panel:#FFFFFF; --panel-alt:#F3F6F8; --ink:#1E2A38; --ink-soft:#5C6B7A;
    --line:#D3DCE3; --blue:#2B5D8C; --teal:#2F6F5E; --gold:#B98A2E; --rust:#B0402C;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Inter',sans-serif; color:var(--ink); background:var(--bg); padding:20px; }
  .app { max-width:1120px; margin:0 auto; }

  .login-wrap { max-width:380px; margin:80px auto; background:var(--panel); border:1px solid var(--line); padding:32px; }
  .login-wrap h1 { font-family:'Roboto Slab',serif; font-size:22px; margin:0 0 6px; }
  .login-wrap p { font-size:13px; color:var(--ink-soft); margin:0 0 20px; }
  .login-wrap input { width:100%; padding:10px; border:1px solid var(--line); border-radius:3px; margin-bottom:10px; font-family:inherit; font-size:14px; }
  .login-wrap button { width:100%; padding:10px; background:var(--blue); color:#fff; border:none; border-radius:3px; font-size:14px; cursor:pointer; font-family:inherit; }
  .login-error { color:var(--rust); font-size:13px; margin-top:8px; }

  .head { display:flex; justify-content:space-between; align-items:flex-end; padding:24px 0 16px; flex-wrap:wrap; gap:12px; border-bottom:1px solid var(--line); }
  .title { font-family:'Roboto Slab',serif; font-weight:700; font-size:24px; margin:0; }
  .subtitle { font-size:13px; color:var(--ink-soft); margin-top:2px; }
  .icon-btn { border:1px solid var(--line); background:transparent; border-radius:3px; padding:6px 10px; cursor:pointer; color:var(--ink-soft); font-size:13px; font-family:inherit; }

  .nav { display:flex; gap:4px; padding:14px 0; flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:18px; }
  .nav button { background:transparent; border:1px solid transparent; padding:7px 12px; border-radius:3px; font-size:13px; font-family:inherit; cursor:pointer; color:var(--ink-soft); }
  .nav button.active { background:var(--ink); color:#fff; }
  .nav button:hover:not(.active) { border-color:var(--line); color:var(--ink); }

  .card { background:var(--panel); border:1px solid var(--line); padding:20px; margin-bottom:18px; }
  .card h3 { font-family:'Roboto Slab',serif; font-size:16px; margin:0 0 14px; }
  .stats-row { display:flex; flex-wrap:wrap; gap:0; border:1px solid var(--line); margin-bottom:18px; background:var(--panel); }
  .stat { flex:1 1 160px; padding:16px 20px; border-right:1px solid var(--line); }
  .stat:last-child { border-right:none; }
  .stat-label { font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; }
  .stat-value { font-family:'Roboto Slab',serif; font-size:20px; font-weight:700; margin-top:3px; }

  .btn { display:inline-flex; align-items:center; gap:6px; font-size:13.5px; font-weight:500; padding:8px 14px; border-radius:3px; border:1px solid var(--ink); background:var(--ink); color:#fff; cursor:pointer; font-family:inherit; }
  .btn.secondary { background:transparent; color:var(--ink); }
  .btn.blue { background:var(--blue); border-color:var(--blue); }
  .btn:hover { opacity:.85; }

  table { width:100%; border-collapse:collapse; font-size:13px; }
  thead th { text-align:left; font-weight:600; font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  tbody td { padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  tbody tr:nth-child(even) { background:var(--panel-alt); }
  .mono { font-family:'IBM Plex Mono',monospace; font-size:12px; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .row-actions { display:flex; gap:4px; justify-content:flex-end; }
  .empty { padding:30px; text-align:center; color:var(--ink-soft); }
  .table-wrap { overflow-x:auto; }

  .form-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .field label { display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:4px; }
  .field input, .field select, .field textarea { width:100%; padding:8px 9px; border:1px solid var(--line); border-radius:3px; font-size:13.5px; font-family:inherit; background:#fff; }
  .form-actions { display:flex; gap:8px; margin-top:16px; justify-content:flex-end; }
  .confirm-box { display:flex; align-items:center; gap:8px; font-size:12px; }
  .banner { display:flex; align-items:center; gap:8px; background:#F7E3DD; color:var(--rust); border:1px solid var(--line); padding:10px 14px; font-size:13px; margin-bottom:14px; }
  .pill { display:inline-block; padding:2px 8px; border-radius:2px; font-size:11px; font-weight:600; }
  .pill.pendiente { background:#FCEFD8; color:var(--gold); }
  .pill.pagada { background:#DCEFE9; color:var(--teal); }
  .pill.anulada { background:#F7E3DD; color:var(--rust); }

  .item-row { display:grid; grid-template-columns:2fr 80px 100px 120px 30px; gap:8px; margin-bottom:6px; align-items:center; }
  .cuenta-line { display:grid; grid-template-columns:2fr 120px 120px 30px; gap:8px; margin-bottom:6px; align-items:center; }

  @media (max-width:720px) { .form-grid { grid-template-columns:1fr; } .item-row, .cuenta-line { grid-template-columns:1fr; } }
</style>
</head>
<body>

<div id="login-screen" class="login-wrap">
  <h1>Vidriería — Sistema</h1>
  <p>Inicia sesión para continuar.</p>
  <input id="login-email" type="email" placeholder="Correo" />
  <input id="login-password" type="password" placeholder="Contraseña" />
  <button onclick="doLogin()">Entrar</button>
  <div id="login-error" class="login-error"></div>
</div>

<div id="app" class="app" style="display:none;"></div>

<script>
const supa = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

const TIPOS_IMPUESTO = { gravado15:'Gravado 15%', gravado18:'Gravado 18%', exento:'Exento', exonerado:'Exonerado' };

let state = {
  user:null, view:'dashboard', saveError:null,
  clientes:[], productos:[], cuentas:[], facturas:[], asientos:[], config:null,
  clienteForm:null, productoForm:null, cuentaForm:null,
  facturaForm:null, asientoForm:null, configForm:null,
  confirmDelete:null, facturaDetalle:null,
};

function money(n){ return "L " + (Number(n)||0).toFixed(2); }
function esc(s){ return (s??"").toString().replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function uid(){ return 'tmp'+Math.random().toString(36).slice(2); }

async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const { data, error } = await supa.auth.signInWithPassword({ email, password });
  if (error){ document.getElementById('login-error').textContent = "No se pudo iniciar sesión: " + error.message; return; }
  state.user = data.user;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  await loadAll();
}
async function logout(){ await supa.auth.signOut(); location.reload(); }

async function loadAll(){
  const [c1,c2,c3,c4,c5] = await Promise.all([
    supa.from('clientes').select('*').order('nombre'),
    supa.from('productos').select('*').order('nombre'),
    supa.from('cuentas_contables').select('*').order('codigo'),
    supa.from('facturas').select('*, clientes(nombre), factura_items(*)').order('numero', { ascending:false }),
    supa.from('asientos').select('*, asiento_detalle(*, cuentas_contables(codigo,nombre,tipo,naturaleza))').order('fecha', { ascending:false }),
  ]);
  state.clientes = c1.data || [];
  state.productos = c2.data || [];
  state.cuentas = c3.data || [];
  state.facturas = c4.data || [];
  state.asientos = c5.data || [];
  const cfg = await supa.from('config_facturacion').select('*').eq('user_id', state.user.id).maybeSingle();
  if (cfg.data) state.config = cfg.data;
  else {
    state.config = { razon_social:'', rtn_empresa:'', direccion_empresa:'', cai:'', rango_inicio:1, rango_fin:1000, siguiente_numero:1, fecha_limite_emision:null };
    await supa.from('config_facturacion').insert({ user_id: state.user.id, ...state.config });
  }
  render();
}

function setView(v){ state.view = v; render(); }

// ---------- CUENTAS helpers ----------
function cuentaById(id){ return state.cuentas.find(c=>c.id===id); }
function saldoCuenta(cuentaId){
  let debe=0, haber=0;
  state.asientos.forEach(a=>{
    (a.asiento_detalle||[]).forEach(d=>{
      if (d.cuenta_id === cuentaId){ debe += Number(d.debe)||0; haber += Number(d.haber)||0; }
    });
  });
  const cuenta = cuentaById(cuentaId);
  const saldo = cuenta && cuenta.naturaleza === 'acreedora' ? (haber-debe) : (debe-haber);
  return { debe, haber, saldo };
}

// ---------- DASHBOARD ----------
function renderDashboard(){
  const totalFacturado = state.facturas.filter(f=>f.estado!=='anulada').reduce((s,f)=>s+Number(f.total||0),0);
  const isvPorPagar = saldoCuenta(cuentaCodigo('2200')?.id).saldo;
  const porCobrar = saldoCuenta(cuentaCodigo('1200')?.id).saldo;
  const caja = saldoCuenta(cuentaCodigo('1100')?.id).saldo;
  const ingresos = ['4100','4200','4300','4400'].reduce((s,cod)=>{ const c=cuentaCodigo(cod); return s + (c?saldoCuenta(c.id).saldo:0); },0);
  const gastos = ['5100','5200','5300','5400'].reduce((s,cod)=>{ const c=cuentaCodigo(cod); return s + (c?saldoCuenta(c.id).saldo:0); },0);
  const utilidad = ingresos - gastos;
  return `
    <div class="stats-row">
      <div class="stat"><div class="stat-label">Facturado</div><div class="stat-value">${money(totalFacturado)}</div></div>
      <div class="stat"><div class="stat-label">Caja</div><div class="stat-value">${money(caja)}</div></div>
      <div class="stat"><div class="stat-label">Por cobrar</div><div class="stat-value">${money(porCobrar)}</div></div>
      <div class="stat"><div class="stat-label">ISV por pagar</div><div class="stat-value">${money(isvPorPagar)}</div></div>
      <div class="stat"><div class="stat-label">Utilidad del ejercicio</div><div class="stat-value" style="color:var(--teal)">${money(utilidad)}</div></div>
    </div>
    <div class="card">
      <h3>Últimas facturas</h3>
      ${renderFacturasTable(state.facturas.slice(0,8), false)}
    </div>
  `;
}
function cuentaCodigo(cod){ return state.cuentas.find(c=>c.codigo===cod); }

// ---------- CLIENTES ----------
function emptyCliente(){ return { id:null, nombre:'', rtn:'', direccion:'', telefono:'', email:'' }; }
function openNewCliente(){ state.clienteForm = emptyCliente(); render(); }
function openEditCliente(c){ state.clienteForm = { ...c }; render(); }
function closeClienteForm(){ state.clienteForm = null; render(); }
function setClienteField(k,v){ state.clienteForm[k]=v; }
async function saveCliente(){
  const f = state.clienteForm;
  const clean = { nombre:f.nombre, rtn:f.rtn, direccion:f.direccion, telefono:f.telefono, email:f.email };
  let error;
  if (f.id) ({ error } = await supa.from('clientes').update(clean).eq('id', f.id));
  else ({ error } = await supa.from('clientes').insert({ ...clean, user_id: state.user.id }));
  state.saveError = error ? 'No se pudo guardar el cliente.' : null;
  state.clienteForm = null;
  await loadAll();
}
async function deleteCliente(id){
  const { error } = await supa.from('clientes').delete().eq('id', id);
  state.saveError = error ? 'No se pudo eliminar (puede tener facturas asociadas).' : null;
  state.confirmDelete = null;
  await loadAll();
}
function renderClientes(){
  return `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h3 style="margin:0;">Clientes</h3>
        <button class="btn" onclick="openNewCliente()">+ Nuevo cliente</button>
      </div>
      ${state.clienteForm ? renderClienteForm() : ''}
      <div class="table-wrap"><table>
        <thead><tr><th>Nombre</th><th>RTN</th><th>Dirección</th><th>Teléfono</th><th></th></tr></thead>
        <tbody>
          ${state.clientes.map(c=>`
            <tr>
              <td>${esc(c.nombre)}</td>
              <td class="mono">${esc(c.rtn)||'—'}</td>
              <td>${esc(c.direccion)||'—'}</td>
              <td>${esc(c.telefono)||'—'}</td>
              <td>${state.confirmDelete===c.id
                ? `<div class="confirm-box">¿Eliminar? <button class="btn secondary" onclick="state.confirmDelete=null; render()">No</button><button class="btn" onclick="deleteCliente('${c.id}')">Sí</button></div>`
                : `<div class="row-actions"><button class="icon-btn" onclick='openEditCliente(${JSON.stringify(c).replace(/'/g,"&#39;")})'>Editar</button><button class="icon-btn" onclick="state.confirmDelete='${c.id}'; render()">Borrar</button></div>`}</td>
            </tr>`).join('')}
        </tbody>
      </table></div>
      ${state.clientes.length===0 ? `<div class="empty">No hay clientes todavía.</div>` : ''}
    </div>
  `;
}
function renderClienteForm(){
  const f = state.clienteForm;
  return `<div class="card" style="background:var(--panel-alt);">
    <div class="form-grid">
      <div class="field"><label>Nombre / Razón social</label><input value="${esc(f.nombre)}" onchange="setClienteField('nombre',this.value)" /></div>
      <div class="field"><label>RTN</label><input value="${esc(f.rtn)}" onchange="setClienteField('rtn',this.value)" /></div>
      <div class="field"><label>Teléfono</label><input value="${esc(f.telefono)}" onchange="setClienteField('telefono',this.value)" /></div>
      <div class="field" style="grid-column:span 2;"><label>Dirección</label><input value="${esc(f.direccion)}" onchange="setClienteField('direccion',this.value)" /></div>
      <div class="field"><label>Email</label><input value="${esc(f.email)}" onchange="setClienteField('email',this.value)" /></div>
    </div>
    <div class="form-actions">
      <button class="btn secondary" onclick="closeClienteForm()">Cancelar</button>
      <button class="btn" onclick="saveCliente()">Guardar</button>
    </div>
  </div>`;
}

// ---------- PRODUCTOS ----------
function emptyProducto(){ return { id:null, nombre:'', descripcion:'', precio_unitario:'', tipo_impuesto:'gravado15' }; }
function openNewProducto(){ state.productoForm = emptyProducto(); render(); }
function openEditProducto(p){ state.productoForm = { ...p, precio_unitario:String(p.precio_unitario) }; render(); }
function closeProductoForm(){ state.productoForm = null; render(); }
function setProductoField(k,v){ state.productoForm[k]=v; }
async function saveProducto(){
  const f = state.productoForm;
  const clean = { nombre:f.nombre, descripcion:f.descripcion, precio_unitario:Number(f.precio_unitario)||0, tipo_impuesto:f.tipo_impuesto };
  let error;
  if (f.id) ({ error } = await supa.from('productos').update(clean).eq('id', f.id));
  else ({ error } = await supa.from('productos').insert({ ...clean, user_id: state.user.id }));
  state.saveError = error ? 'No se pudo guardar el producto.' : null;
  state.productoForm = null;
  await loadAll();
}
async function deleteProducto(id){
  const { error } = await supa.from('productos').delete().eq('id', id);
  state.saveError = error ? 'No se pudo eliminar.' : null;
  state.confirmDelete = null;
  await loadAll();
}
function renderProductos(){
  return `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h3 style="margin:0;">Productos / Servicios</h3>
        <button class="btn" onclick="openNewProducto()">+ Nuevo producto</button>
      </div>
      ${state.productoForm ? renderProductoForm() : ''}
      <div class="table-wrap"><table>
        <thead><tr><th>Nombre</th><th>Descripción</th><th class="num">Precio</th><th>Impuesto</th><th></th></tr></thead>
        <tbody>
          ${state.productos.map(p=>`
            <tr>
              <td>${esc(p.nombre)}</td>
              <td>${esc(p.descripcion)||'—'}</td>
              <td class="num">${money(p.precio_unitario)}</td>
              <td>${TIPOS_IMPUESTO[p.tipo_impuesto]||p.tipo_impuesto}</td>
              <td>${state.confirmDelete===p.id
                ? `<div class="confirm-box">¿Eliminar? <button class="btn secondary" onclick="state.confirmDelete=null; render()">No</button><button class="btn" onclick="deleteProducto('${p.id}')">Sí</button></div>`
                : `<div class="row-actions"><button class="icon-btn" onclick='openEditProducto(${JSON.stringify(p).replace(/'/g,"&#39;")})'>Editar</button><button class="icon-btn" onclick="state.confirmDelete='${p.id}'; render()">Borrar</button></div>`}</td>
            </tr>`).join('')}
        </tbody>
      </table></div>
      ${state.productos.length===0 ? `<div class="empty">No hay productos todavía.</div>` : ''}
    </div>
  `;
}
function renderProductoForm(){
  const f = state.productoForm;
  return `<div class="card" style="background:var(--panel-alt);">
    <div class="form-grid">
      <div class="field"><label>Nombre</label><input value="${esc(f.nombre)}" onchange="setProductoField('nombre',this.value)" /></div>
      <div class="field"><label>Precio unitario (L)</label><input type="number" step="0.01" value="${esc(f.precio_unitario)}" onchange="setProductoField('precio_unitario',this.value)" /></div>
      <div class="field"><label>Tipo de impuesto</label>
        <select onchange="setProductoField('tipo_impuesto',this.value)">
          ${Object.entries(TIPOS_IMPUESTO).map(([k,v])=>`<option value="${k}" ${f.tipo_impuesto===k?'selected':''}>${v}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="grid-column:span 3;"><label>Descripción</label><input value="${esc(f.descripcion)}" onchange="setProductoField('descripcion',this.value)" /></div>
    </div>
    <div class="form-actions">
      <button class="btn secondary" onclick="closeProductoForm()">Cancelar</button>
      <button class="btn" onclick="saveProducto()">Guardar</button>
    </div>
  </div>`;
}

// ---------- FACTURAS ----------
function emptyFacturaItem(){ return { _id:uid(), producto_id:'', descripcion:'', cantidad:1, precio_unitario:0, tipo_impuesto:'gravado15' }; }
function emptyFactura(){
  return { id:null, fecha:new Date().toISOString().slice(0,10), cliente_id:'', estado:'pendiente', metodo_pago:'', descuento:0, items:[emptyFacturaItem()] };
}
function openNewFactura(){ state.facturaForm = emptyFactura(); render(); }
function closeFacturaForm(){ state.facturaForm = null; render(); }
function setFacturaField(k,v){ state.facturaForm[k]=v; render(); }
function addFacturaItem(){ state.facturaForm.items.push(emptyFacturaItem()); render(); }
function removeFacturaItem(_id){ state.facturaForm.items = state.facturaForm.items.filter(i=>i._id!==_id); render(); }
function setItemField(_id,k,v){
  const item = state.facturaForm.items.find(i=>i._id===_id);
  if (k==='producto_id' && v){
    const prod = state.productos.find(p=>p.id===v);
    if (prod){ item.producto_id=v; item.descripcion=prod.nombre; item.precio_unitario=prod.precio_unitario; item.tipo_impuesto=prod.tipo_impuesto; render(); return; }
  }
  item[k] = v;
  render();
}
function calcFacturaTotales(f){
  const totales = { subtotal:0, exonerado:0, exento:0, gravado15:0, gravado18:0, isv15:0, isv18:0 };
  f.items.forEach(it=>{
    const t = (Number(it.cantidad)||0) * (Number(it.precio_unitario)||0);
    totales.subtotal += t;
    if (it.tipo_impuesto==='exonerado') totales.exonerado += t;
    else if (it.tipo_impuesto==='exento') totales.exento += t;
    else if (it.tipo_impuesto==='gravado18') totales.gravado18 += t;
    else totales.gravado15 += t;
  });
  totales.isv15 = totales.gravado15 * 0.15;
  totales.isv18 = totales.gravado18 * 0.18;
  const descuento = Number(f.descuento)||0;
  totales.total = totales.subtotal + totales.isv15 + totales.isv18 - descuento;
  return totales;
}
async function saveFactura(){
  const f = state.facturaForm;
  if (!f.cliente_id){ state.saveError = 'Selecciona un cliente.'; render(); return; }
  const t = calcFacturaTotales(f);
  const numero = formatNumero(state.config.siguiente_numero);
  const { data: nuevaFactura, error } = await supa.from('facturas').insert({
    user_id: state.user.id, numero, fecha: f.fecha, cliente_id: f.cliente_id,
    subtotal: t.subtotal, descuento: Number(f.descuento)||0,
    importe_exonerado: t.exonerado, importe_exento: t.exento,
    importe_gravado_15: t.gravado15, importe_gravado_18: t.gravado18,
    isv_15: t.isv15, isv_18: t.isv18, total: t.total,
    estado: f.estado, metodo_pago: f.metodo_pago,
  }).select().single();
  if (error){ state.saveError = 'No se pudo guardar la factura.'; render(); return; }

  const itemsInsert = f.items.filter(i=>i.descripcion).map(i=>({
    factura_id: nuevaFactura.id, producto_id: i.producto_id||null, descripcion:i.descripcion,
    cantidad:Number(i.cantidad)||0, precio_unitario:Number(i.precio_unitario)||0, tipo_impuesto:i.tipo_impuesto,
    total:(Number(i.cantidad)||0)*(Number(i.precio_unitario)||0),
  }));
  await supa.from('factura_items').insert(itemsInsert);

  await crearAsientoDeFactura(nuevaFactura, t);

  await supa.from('config_facturacion').update({ siguiente_numero: state.config.siguiente_numero + 1 }).eq('user_id', state.user.id);

  state.facturaForm = null;
  await loadAll();
}
function formatNumero(n){
  const c = state.config;
  const base = c && c.rango_inicio!=null ? `000-001-01-${String(n).padStart(8,'0')}` : String(n);
  return base;
}
async function crearAsientoDeFactura(factura, t){
  const cCaja = cuentaCodigo('1100'), cCxC = cuentaCodigo('1200');
  const c15 = cuentaCodigo('4100'), c18 = cuentaCodigo('4200'), cExe = cuentaCodigo('4300'), cIsv = cuentaCodigo('2200');
  const { data: asiento } = await supa.from('asientos').insert({
    user_id: state.user.id, fecha: factura.fecha, descripcion: `Factura ${factura.numero}`, origen:'factura', factura_id: factura.id,
  }).select().single();
  const detalle = [];
  const debitoCuenta = factura.estado==='pagada' ? cCaja : cCxC;
  if (debitoCuenta) detalle.push({ asiento_id: asiento.id, cuenta_id: debitoCuenta.id, debe: t.total, haber:0 });
  if (t.gravado15>0 && c15) detalle.push({ asiento_id: asiento.id, cuenta_id:c15.id, debe:0, haber:t.gravado15 });
  if (t.gravado18>0 && c18) detalle.push({ asiento_id: asiento.id, cuenta_id:c18.id, debe:0, haber:t.gravado18 });
  if ((t.exento+t.exonerado)>0 && cExe) detalle.push({ asiento_id: asiento.id, cuenta_id:cExe.id, debe:0, haber:(t.exento+t.exonerado) });
  if ((t.isv15+t.isv18)>0 && cIsv) detalle.push({ asiento_id: asiento.id, cuenta_id:cIsv.id, debe:0, haber:(t.isv15+t.isv18) });
  await supa.from('asiento_detalle').insert(detalle);
}
async function marcarPagada(factura){
  const cCaja = cuentaCodigo('1100'), cCxC = cuentaCodigo('1200');
  const { data: asiento } = await supa.from('asientos').insert({
    user_id: state.user.id, fecha: new Date().toISOString().slice(0,10), descripcion:`Cobro factura ${factura.numero}`, origen:'factura', factura_id: factura.id,
  }).select().single();
  await supa.from('asiento_detalle').insert([
    { asiento_id: asiento.id, cuenta_id: cCaja.id, debe: factura.total, haber:0 },
    { asiento_id: asiento.id, cuenta_id: cCxC.id, debe:0, haber: factura.total },
  ]);
  await supa.from('facturas').update({ estado:'pagada' }).eq('id', factura.id);
  await loadAll();
}
async function anularFactura(factura){
  const { data: asientosOrig } = await supa.from('asiento_detalle').select('*').in('asiento_id',
    (await supa.from('asientos').select('id').eq('factura_id', factura.id)).data.map(a=>a.id));
  const { data: nuevoAsiento } = await supa.from('asientos').insert({
    user_id: state.user.id, fecha:new Date().toISOString().slice(0,10), descripcion:`Anulación factura ${factura.numero}`, origen:'factura', factura_id: factura.id,
  }).select().single();
  const reversa = (asientosOrig||[]).map(d=>({ asiento_id:nuevoAsiento.id, cuenta_id:d.cuenta_id, debe:d.haber, haber:d.debe }));
  if (reversa.length) await supa.from('asiento_detalle').insert(reversa);
  await supa.from('facturas').update({ estado:'anulada' }).eq('id', factura.id);
  state.confirmDelete = null;
  await loadAll();
}

function emptyCuenta(){ return { id:null, codigo:'', nombre:'', tipo:'activo', naturaleza:'deudora' }; }

function openEditCuenta(c){ state.cuentaForm = { ...c }; render(); }
function closeCuentaForm(){ state.cuentaForm = null; render(); }
function setCuentaField(k,v){
  state.cuentaForm[k]=v;
  if (k==='tipo') state.cuentaForm.naturaleza = (v==='activo'||v==='gasto') ? 'deudora' : 'acreedora';
  render();
}
async function saveCuenta(){
  const f = state.cuentaForm;
  const clean = { codigo:f.codigo, nombre:f.nombre, tipo:f.tipo, naturaleza:f.naturaleza };
  let error;
  if (f.id) ({ error } = await supa.from('cuentas_contables').update(clean).eq('id', f.id));
  else ({ error } = await supa.from('cuentas_contables').insert({ ...clean, user_id: state.user.id }));
  state.saveError = error ? 'No se pudo guardar la cuenta.' : null;
  state.cuentaForm = null;
  await loadAll();
}

function emptyAsientoLinea(){ return { _id:uid(), cuenta_id:'', debe:'', haber:'' }; }
function emptyAsientoForm(){ return { fecha:new Date().toISOString().slice(0,10), descripcion:'', lineas:[emptyAsientoLinea(), emptyAsientoLinea()] }; }
function openNewAsiento(){ state.asientoForm = emptyAsientoForm(); render(); }
function closeAsientoForm(){ state.asientoForm = null; render(); }
function setAsientoField(k,v){ state.asientoForm[k]=v; render(); }
function addAsientoLinea(){ state.asientoForm.lineas.push(emptyAsientoLinea()); render(); }
function removeAsientoLinea(_id){ state.asientoForm.lineas = state.asientoForm.lineas.filter(l=>l._id!==_id); render(); }
function setLineaField(_id,k,v){ const l = state.asientoForm.lineas.find(x=>x._id===_id); l[k]=v; render(); }
async function saveAsiento(){
  const f = state.asientoForm;
  const totalDebe = f.lineas.reduce((s,l)=>s+(Number(l.debe)||0),0);
  const totalHaber = f.lineas.reduce((s,l)=>s+(Number(l.haber)||0),0);
  if (Math.abs(totalDebe-totalHaber) > 0.01){ state.saveError = `El asiento no cuadra: Debe ${totalDebe.toFixed(2)} vs Haber ${totalHaber.toFixed(2)}.`; render(); return; }
  const { data: asiento, error } = await supa.from('asientos').insert({ user_id: state.user.id, fecha:f.fecha, descripcion:f.descripcion, origen:'manual' }).select().single();
  if (error){ state.saveError = 'No se pudo guardar el asiento.'; render(); return; }
  const detalle = f.lineas.filter(l=>l.cuenta_id).map(l=>({ asiento_id: asiento.id, cuenta_id:l.cuenta_id, debe:Number(l.debe)||0, haber:Number(l.haber)||0 }));
  await supa.from('asiento_detalle').insert(detalle);
  state.asientoForm = null;
  state.saveError = null;
  await loadAll();
}

// ---------- BALANCE GENERAL ----------
function renderBalance(){
  const grupos = { activo:[], pasivo:[], patrimonio:[] };
  state.cuentas.forEach(c=>{ if (grupos[c.tipo]) grupos[c.tipo].push({ ...c, saldo:saldoCuenta(c.id).saldo }); });
  const totalActivo = grupos.activo.reduce((s,c)=>s+c.saldo,0);
  const totalPasivo = grupos.pasivo.reduce((s,c)=>s+c.saldo,0);
  const ingresos = state.cuentas.filter(c=>c.tipo==='ingreso').reduce((s,c)=>s+saldoCuenta(c.id).saldo,0);
  const gastos = state.cuentas.filter(c=>c.tipo==='gasto').reduce((s,c)=>s+saldoCuenta(c.id).saldo,0);
  const utilidad = ingresos - gastos;
  const totalPatrimonio = grupos.patrimonio.reduce((s,c)=>s+c.saldo,0) + utilidad;
  const cuadra = Math.abs(totalActivo - (totalPasivo+totalPatrimonio)) < 0.01;
  const seccion = (titulo, lista, extra) => `
    <h4 style="font-size:13px; margin:16px 0 8px;">${titulo}</h4>
    <div class="table-wrap"><table><tbody>
      ${lista.map(c=>`<tr><td class="mono">${esc(c.codigo)}</td><td>${esc(c.nombre)}</td><td class="num">${money(c.saldo)}</td></tr>`).join('')}
      ${extra ? `<tr><td></td><td><em>${extra.label}</em></td><td class="num">${money(extra.valor)}</td></tr>` : ''}
    </tbody></table></div>`;
  return `<div class="card">
    <h3>Balance general</h3>
    ${seccion('ACTIVO', grupos.activo)}
    <div style="text-align:right; font-weight:700; padding:6px 0; border-top:1px solid var(--line);">TOTAL ACTIVO: ${money(totalActivo)}</div>
    ${seccion('PASIVO', grupos.pasivo)}
    <div style="text-align:right; font-weight:700; padding:6px 0; border-top:1px solid var(--line);">TOTAL PASIVO: ${money(totalPasivo)}</div>
    ${seccion('PATRIMONIO', grupos.patrimonio, { label:'Utilidad del ejercicio', valor:utilidad })}
    <div style="text-align:right; font-weight:700; padding:6px 0; border-top:1px solid var(--line);">TOTAL PATRIMONIO: ${money(totalPatrimonio)}</div>
    <div style="text-align:right; margin-top:10px; font-size:15px; font-weight:700; color:${cuadra?'var(--teal)':'var(--rust)'};">
      PASIVO + PATRIMONIO: ${money(totalPasivo+totalPatrimonio)} ${cuadra?'✓ Cuadra':'✗ No cuadra'}
    </div>
  </div>`;
}

// ---------- ESTADO DE RESULTADOS ----------
function renderResultados(){
  const ingresos = state.cuentas.filter(c=>c.tipo==='ingreso').map(c=>({ ...c, saldo:saldoCuenta(c.id).saldo }));
  const gastos = state.cuentas.filter(c=>c.tipo==='gasto').map(c=>({ ...c, saldo:saldoCuenta(c.id).saldo }));
  const totalIngresos = ingresos.reduce((s,c)=>s+c.saldo,0);
  const totalGastos = gastos.reduce((s,c)=>s+c.saldo,0);
  return `<div class="card">
    <h3>Estado de resultados</h3>
    <h4 style="font-size:13px; margin-bottom:8px;">INGRESOS</h4>
    <div class="table-wrap"><table><tbody>${ingresos.map(c=>`<tr><td class="mono">${esc(c.codigo)}</td><td>${esc(c.nombre)}</td><td class="num">${money(c.saldo)}</td></tr>`).join('')}</tbody></table></div>
    <div style="text-align:right; font-weight:700; padding:6px 0; border-top:1px solid var(--line);">TOTAL INGRESOS: ${money(totalIngresos)}</div>
    <h4 style="font-size:13px; margin:16px 0 8px;">COSTOS Y GASTOS</h4>
    <div class="table-wrap"><table><tbody>${gastos.map(c=>`<tr><td class="mono">${esc(c.codigo)}</td><td>${esc(c.nombre)}</td><td class="num">${money(c.saldo)}</td></tr>`).join('')}</tbody></table></div>
    <div style="text-align:right; font-weight:700; padding:6px 0; border-top:1px solid var(--line);">TOTAL GASTOS: ${money(totalGastos)}</div>
    <div style="text-align:right; margin-top:10px; font-size:16px; font-weight:700; color:var(--teal);">UTILIDAD NETA: ${money(totalIngresos-totalGastos)}</div>
  </div>`;
}

// ---------- CONFIGURACION ----------
function renderConfig(){
  const c = state.configForm || state.config;
  return `<div class="card">
    <h3>Configuración de facturación (datos ficticios de prueba)</h3>
    <div class="banner" style="background:#FCEFD8; color:var(--gold);">Recuerda: este CAI es de prueba. Para uno real válido ante el SAR, gestiónalo directamente con ellos o con tu contador.</div>
    <div class="form-grid">
      <div class="field"><label>Razón social</label><input value="${esc(c.razon_social)}" onchange="setConfigField('razon_social',this.value)" /></div>
      <div class="field"><label>RTN empresa</label><input value="${esc(c.rtn_empresa)}" onchange="setConfigField('rtn_empresa',this.value)" /></div>
      <div class="field"><label>Dirección</label><input value="${esc(c.direccion_empresa)}" onchange="setConfigField('direccion_empresa',this.value)" /></div>
      <div class="field"><label>CAI (ficticio)</label><input value="${esc(c.cai)}" onchange="setConfigField('cai',this.value)" /></div>
      <div class="field"><label>Rango inicio</label><input type="number" value="${esc(c.rango_inicio)}" onchange="setConfigField('rango_inicio',this.value)" /></div>
      <div class="field"><label>Rango fin</label><input type="number" value="${esc(c.rango_fin)}" onchange="setConfigField('rango_fin',this.value)" /></div>
      <div class="field"><label>Siguiente número</label><input type="number" value="${esc(c.siguiente_numero)}" onchange="setConfigField('siguiente_numero',this.value)" /></div>
      <div class="field"><label>Fecha límite de emisión</label><input type="date" value="${esc(c.fecha_limite_emision)}" onchange="setConfigField('fecha_limite_emision',this.value)" /></div>
    </div>
    <div class="form-actions"><button class="btn" onclick="saveConfig()">Guardar configuración</button></div>
  </div>`;
}
function setConfigField(k,v){ state.configForm = state.configForm || { ...state.config }; state.configForm[k]=v; render(); }
async function saveConfig(){
  const c = state.configForm;
  const { error } = await supa.from('config_facturacion').update({
    razon_social:c.razon_social, rtn_empresa:c.rtn_empresa, direccion_empresa:c.direccion_empresa, cai:c.cai,
    rango_inicio:Number(c.rango_inicio)||0, rango_fin:Number(c.rango_fin)||0, siguiente_numero:Number(c.siguiente_numero)||1,
    fecha_limite_emision:c.fecha_limite_emision||null,
  }).eq('user_id', state.user.id);
  state.saveError = error ? 'No se pudo guardar la configuración.' : null;
  state.configForm = null;
  await loadAll();
}

// ---------- RENDER PRINCIPAL ----------
function render(){
  const app = document.getElementById('app');
  const views = {
    dashboard: renderDashboard, facturas: renderFacturas, clientes: renderClientes, productos: renderProductos,
    cuentas: renderCuentas, diario: renderDiario, mayor: renderMayor, balance: renderBalance, resultados: renderResultados, config: renderConfig,
  };
  app.innerHTML = `
    <div class="head">
      <div><p class="title">${esc(state.config?.razon_social)||'Vidriería'} — Sistema</p><div class="subtitle">Facturación y contabilidad</div></div>
      <button class="icon-btn" onclick="logout()">Cerrar sesión</button>
    </div>
    <div class="nav">
      ${Object.keys(views).map(v=>`<button class="${state.view===v?'active':''}" onclick="setView('${v}')">${labelView(v)}</button>`).join('')}
    </div>
    ${state.saveError ? `<div class="banner">${esc(state.saveError)}</div>` : ''}
    ${views[state.view]()}
  `;
}
function labelView(v){
  return { dashboard:'Resumen', facturas:'Facturas', clientes:'Clientes', productos:'Productos', cuentas:'Cuentas', diario:'Libro diario', mayor:'Libro mayor', balance:'Balance general', resultados:'Estado de resultados', config:'Configuración' }[v];
}

supa.auth.getSession().then(({ data }) => {
  if (data.session){
    state.user = data.session.user;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadAll();
  }
});
</script>
</body>
</html>
